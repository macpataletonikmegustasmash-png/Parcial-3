<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle del donador | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/donador.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando donador...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1>Donador #<span data-campo="id"></span></h1>

            <dl class="datos">
                <dt>Tipo de donador</dt>
                <dd data-campo="tipoDonador"></dd>
                <dt>Calle</dt>
                <dd data-campo="calleDonador"></dd>
                <dt>Número exterior</dt>
                <dd data-campo="numeroDonador"></dd>
                <dt>Código postal</dt>
                <dd data-campo="cpDonador"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="donador-form.html">Editar</a>
                <a class="boton boton--secundario" href="donadores.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/donador.js"></script>
</body>
</html>
