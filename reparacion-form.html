<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de reparación | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/reparacion-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar reparación</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="ID_diagnostico">Diagnóstico <span class="obligatorio">*</span></label>
                <select id="ID_diagnostico" name="ID_diagnostico" required>
                    <option value="">Selecciona un diagnóstico</option>
                </select>
            </div>

            <div class="campo">
                <label for="descripcionReparacion">Descripción del trabajo <span class="obligatorio">*</span></label>
                <textarea id="descripcionReparacion" name="descripcionReparacion" rows="3" maxlength="200" required></textarea>
            </div>

            <div class="campo">
                <label for="fechaInicioReparacion">Fecha de inicio <span class="obligatorio">*</span></label>
                <input type="date" id="fechaInicioReparacion" name="fechaInicioReparacion" required />
            </div>

            <div class="campo">
                <label for="fechaTerminoReparacion">Fecha de término</label>
                <input type="date" id="fechaTerminoReparacion" name="fechaTerminoReparacion" />
            </div>

            <div class="campo">
                <label for="costoEstimadoReparacion">Costo estimado en pesos <span class="obligatorio">*</span></label>
                <input type="number" id="costoEstimadoReparacion" name="costoEstimadoReparacion" min="0" step="1" required />
            </div>

            <div class="campo">
                <label for="costoFinalReparacion">Costo final en pesos</label>
                <input type="number" id="costoFinalReparacion" name="costoFinalReparacion" min="0" step="1" />
            </div>

            <div class="campo">
                <label for="estadoReparacion">Estado <span class="obligatorio">*</span></label>
                <select id="estadoReparacion" name="estadoReparacion" required>
                    <option value="">Selecciona un estado</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Terminada">Terminada</option>
                </select>
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="reparaciones.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/reparacion-form.js"></script>
</body>
</html>
