<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de usuario | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/usuario-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar usuario</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="nombre_usuario">Nombre de usuario <span class="obligatorio">*</span></label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" maxlength="30" required />
            </div>

            <div class="campo">
                <label for="correo">Correo <span class="obligatorio">*</span></label>
                <input type="email" id="correo" name="correo" required />
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña (mínimo 8 caracteres) <span class="obligatorio">*</span></label>
                <input type="password" id="contrasena" name="contrasena" minlength="8" autocomplete="new-password" required />
                <p class="mensaje" id="ayuda-contrasena"></p>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono (10 dígitos) <span class="obligatorio">*</span></label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios" required />
            </div>

            <div class="campo">
                <label for="id_rol">Rol <span class="obligatorio">*</span></label>
                <select id="id_rol" name="id_rol" required>
                    <option value="">Selecciona un rol</option>
                </select>
            </div>

            <div class="campo">
                <label for="estado">Estado <span class="obligatorio">*</span></label>
                <select id="estado" name="estado" required>
                    <option value="">Selecciona un estado</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="usuarios.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/usuario-form.js"></script>
</body>
</html>
