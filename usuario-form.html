<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de usuario | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/usuario-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar usuario</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="nombreUsuario">Nombre <span class="obligatorio">*</span></label>
                <input type="text" id="nombreUsuario" name="nombreUsuario" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="apUsuario">Apellido paterno <span class="obligatorio">*</span></label>
                <input type="text" id="apUsuario" name="apUsuario" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="amUsuario">Apellido materno <span class="obligatorio">*</span></label>
                <input type="text" id="amUsuario" name="amUsuario" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="correoUsuario">Correo <span class="obligatorio">*</span></label>
                <input type="email" id="correoUsuario" name="correoUsuario" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="contrasenaUsuario">Contraseña (mínimo 8 caracteres) <span class="obligatorio">*</span></label>
                <input type="password" id="contrasenaUsuario" name="contrasenaUsuario" minlength="8" autocomplete="new-password" required />
                <p class="mensaje" id="ayuda-contrasena"></p>
            </div>

            <div class="campo">
                <label for="telefonoUsuario">Teléfono (10 dígitos) <span class="obligatorio">*</span></label>
                <input type="tel" id="telefonoUsuario" name="telefonoUsuario" pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios" required />
            </div>

            <div class="campo">
                <label for="ID_rol">Rol <span class="obligatorio">*</span></label>
                <select id="ID_rol" name="ID_rol" required>
                    <option value="">Selecciona un rol</option>
                </select>
            </div>

            <div class="campo">
                <label for="estadoUsuario">Estado <span class="obligatorio">*</span></label>
                <select id="estadoUsuario" name="estadoUsuario" required>
                    <option value="">Selecciona un estado</option>
                    <option value="Activo">Activo</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="usuarios.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/usuario-form.js"></script>
</body>
</html>
