<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle de la donación | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/donacion.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando donación...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1>Donación #<span data-campo="id"></span></h1>

            <dl class="datos">
                <dt>Donador</dt>
                <dd data-campo="donador"></dd>
                <dt>Fecha</dt>
                <dd data-campo="fechaDonacion"></dd>
                <dt>Tipo de entrega</dt>
                <dd data-campo="tipoEntregaDonacion"></dd>
                <dt>Observaciones</dt>
                <dd data-campo="observacionesDonacion"></dd>
                <dt>Estado</dt>
                <dd data-campo="estadoDonacion"></dd>
            </dl>

            <h2>Equipos de esta donación</h2>
            <p class="mensaje" id="mensaje-equipos">Cargando equipos...</p>
            <table id="tabla-equipos" hidden>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="donacion-form.html">Editar</a>
                <a class="boton boton--secundario" href="donaciones.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/donacion.js"></script>
</body>
</html>
