<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Iniciar sesión | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/login.css" />
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta acceso">
            <a class="acceso__marca" href="index.html">
                <img class="acceso__logo" src="./src/img/logo.svg" alt="Logo de ReparaTec" width="64" height="64" />
                ReparaTec
            </a>
            <h1 class="acceso__titulo">Iniciar sesión</h1>

            <form id="formulario" novalidate>
                <div class="campo">
                    <label for="correo">Correo <span class="obligatorio">*</span></label>
                    <input type="email" id="correo" name="correo" autocomplete="email" required />
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña <span class="obligatorio">*</span></label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required />
                </div>

                <p class="mensaje" id="mensaje"></p>

                <button class="boton acceso__boton" type="submit">Entrar</button>
            </form>

            <p class="acceso__regresar"><a href="index.html">Regresar a la portada</a></p>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/login.js"></script>
</body>
</html>
