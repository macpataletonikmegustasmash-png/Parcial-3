<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle del beneficiario | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/beneficiario.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando beneficiario...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1><span data-campo="institucionBeneficiario">Beneficiario</span></h1>

            <dl class="datos">
                <dt>Tipo de beneficiario</dt>
                <dd data-campo="tipoBeneficiario"></dd>
                <dt>Necesidad tecnológica</dt>
                <dd data-campo="necesidadBeneficiario"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="beneficiario-form.html">Editar</a>
                <a class="boton boton--secundario" href="beneficiarios.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/beneficiario.js"></script>
</body>
</html>
