<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle de la asignación | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/asignacion.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando asignación...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1>Asignación #<span data-campo="id"></span></h1>

            <dl class="datos">
                <dt>Solicitud</dt>
                <dd data-campo="solicitud"></dd>
                <dt>Beneficiario</dt>
                <dd data-campo="beneficiario"></dd>
                <dt>Fecha de asignación</dt>
                <dd data-campo="fechaAsignacion"></dd>
                <dt>Fecha de entrega</dt>
                <dd data-campo="fechaEntregaAsignacion"></dd>
                <dt>Condiciones de entrega</dt>
                <dd data-campo="condicionesEntregaAsignacion"></dd>
                <dt>Estado</dt>
                <dd data-campo="estadoAsignacion"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="asignacion-form.html">Editar</a>
                <a class="boton boton--secundario" href="asignaciones.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/asignacion.js"></script>
</body>
</html>
