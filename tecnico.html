<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle del técnico | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/tecnico.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando técnico...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1><span data-campo="nombre">Técnico</span> <span data-campo="apellido"></span></h1>

            <dl class="datos">
                <dt>Especialidad</dt>
                <dd data-campo="especialidad"></dd>
                <dt>Teléfono</dt>
                <dd data-campo="telefono"></dd>
                <dt>Correo</dt>
                <dd data-campo="correo"></dd>
                <dt>Disponibilidad</dt>
                <dd data-campo="disponibilidad"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="tecnico-form.html">Editar</a>
                <a class="boton boton--secundario" href="tecnicos.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/tecnico.js"></script>
</body>
</html>
