<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle del componente | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/componente.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando componente...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1 data-campo="nombre_componente"></h1>

            <dl class="datos">
                <dt>Marca</dt>
                <dd data-campo="marca"></dd>
                <dt>Modelo</dt>
                <dd data-campo="modelo"></dd>
                <dt>Descripción</dt>
                <dd data-campo="descripcion"></dd>
                <dt>Precio</dt>
                <dd>$<span data-campo="precio"></span></dd>
                <dt>Existencia</dt>
                <dd><span data-campo="existencia"></span> piezas</dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="componente-form.html">Editar</a>
                <a class="boton boton--secundario" href="componentes.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/componente.js"></script>
</body>
</html>
