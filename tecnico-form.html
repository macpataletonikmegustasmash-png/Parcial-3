<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de técnico | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/tecnico-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar técnico</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="nombre">Nombre <span class="obligatorio">*</span></label>
                <input type="text" id="nombre" name="nombre" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="apellido">Apellido <span class="obligatorio">*</span></label>
                <input type="text" id="apellido" name="apellido" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="especialidad">Especialidad <span class="obligatorio">*</span></label>
                <select id="especialidad" name="especialidad" required>
                    <option value="">Selecciona una especialidad</option>
                    <option value="Computadoras">Computadoras</option>
                    <option value="Tabletas">Tabletas</option>
                    <option value="Teléfonos">Teléfonos</option>
                    <option value="Impresoras">Impresoras</option>
                </select>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono (10 dígitos) <span class="obligatorio">*</span></label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios" required />
            </div>

            <div class="campo">
                <label for="correo">Correo <span class="obligatorio">*</span></label>
                <input type="email" id="correo" name="correo" required />
            </div>

            <div class="campo">
                <label for="disponibilidad">Disponibilidad <span class="obligatorio">*</span></label>
                <select id="disponibilidad" name="disponibilidad" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Disponible">Disponible</option>
                    <option value="Ocupado">Ocupado</option>
                    <option value="No disponible">No disponible</option>
                </select>
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="tecnicos.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/tecnico-form.js"></script>
</body>
</html>
