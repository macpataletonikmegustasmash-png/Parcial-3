<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de donador | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/donador-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar donador</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="tipoDonador">Tipo de donador <span class="obligatorio">*</span></label>
                <select id="tipoDonador" name="tipoDonador" required>
                    <option value="">Selecciona un tipo</option>
                    <option value="Persona">Persona</option>
                    <option value="Empresa">Empresa</option>
                    <option value="Institución">Institución</option>
                </select>
            </div>

            <div class="campo">
                <label for="calleDonador">Calle <span class="obligatorio">*</span></label>
                <input type="text" id="calleDonador" name="calleDonador" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="numeroDonador">Número exterior <span class="obligatorio">*</span></label>
                <input type="number" id="numeroDonador" name="numeroDonador" min="1" step="1" required />
            </div>

            <div class="campo">
                <label for="cpDonador">Código postal (5 dígitos) <span class="obligatorio">*</span></label>
                <input type="text" id="cpDonador" name="cpDonador" inputmode="numeric" pattern="[0-9]{5}" title="Escribe los 5 dígitos del código postal" required />
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="donadores.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/donador-form.js"></script>
</body>
</html>
