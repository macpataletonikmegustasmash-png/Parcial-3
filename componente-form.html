<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de componente | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/componente-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar componente</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="nombre_componente">Nombre del componente <span class="obligatorio">*</span></label>
                <input type="text" id="nombre_componente" name="nombre_componente" maxlength="80" required />
            </div>

            <div class="campo">
                <label for="marca">Marca <span class="obligatorio">*</span></label>
                <input type="text" id="marca" name="marca" maxlength="40" required />
            </div>

            <div class="campo">
                <label for="modelo">Modelo <span class="obligatorio">*</span></label>
                <input type="text" id="modelo" name="modelo" maxlength="40" required />
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="2" maxlength="200"></textarea>
            </div>

            <div class="campo">
                <label for="precio">Precio en pesos <span class="obligatorio">*</span></label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" required />
            </div>

            <div class="campo">
                <label for="existencia">Existencia (piezas) <span class="obligatorio">*</span></label>
                <input type="number" id="existencia" name="existencia" min="0" step="1" required />
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="componentes.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/componente-form.js"></script>
</body>
</html>
