<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Formulario de componente | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/componente-form.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <h1 id="titulo-formulario">Agregar componente</h1>

        <form class="formulario tarjeta" id="formulario" novalidate>
            <div class="campo">
                <label for="nombreComponente">Nombre del componente <span class="obligatorio">*</span></label>
                <input type="text" id="nombreComponente" name="nombreComponente" maxlength="50" required />
            </div>

            <div class="campo">
                <label for="marcaComponente">Marca <span class="obligatorio">*</span></label>
                <input type="text" id="marcaComponente" name="marcaComponente" maxlength="30" required />
            </div>

            <div class="campo">
                <label for="modeloComponente">Modelo <span class="obligatorio">*</span></label>
                <input type="text" id="modeloComponente" name="modeloComponente" maxlength="30" required />
            </div>

            <div class="campo">
                <label for="descripcionComponente">Descripción</label>
                <textarea id="descripcionComponente" name="descripcionComponente" rows="2" maxlength="200"></textarea>
            </div>

            <div class="campo">
                <label for="precioComponente">Precio en pesos <span class="obligatorio">*</span></label>
                <input type="number" id="precioComponente" name="precioComponente" min="0" step="1" required />
            </div>

            <div class="campo">
                <label for="existenciaComponente">Existencia <span class="obligatorio">*</span></label>
                <select id="existenciaComponente" name="existenciaComponente" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Disponible">Disponible</option>
                    <option value="Pocas piezas">Pocas piezas</option>
                    <option value="Agotado">Agotado</option>
                </select>
            </div>

            <p class="mensaje" id="mensaje"></p>

            <div class="formulario__acciones">
                <button class="boton" type="submit">Guardar</button>
                <a class="boton boton--secundario" href="componentes.html">Cancelar</a>
            </div>
        </form>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/componente-form.js"></script>
</body>
</html>
