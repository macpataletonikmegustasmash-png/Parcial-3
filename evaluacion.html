<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle de la evaluación | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/evaluacion.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando evaluación...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1>Evaluación #<span data-campo="id"></span></h1>

            <dl class="datos">
                <dt>Beneficiario</dt>
                <dd data-campo="beneficiario"></dd>
                <dt>Donación</dt>
                <dd data-campo="donacion"></dd>
                <dt>Fecha</dt>
                <dd data-campo="fechaEvaluacion"></dd>
                <dt>Estado de funcionamiento</dt>
                <dd data-campo="estadoFuncionamientoEvaluacion"></dd>
                <dt>Calificación</dt>
                <dd><span data-campo="calificacionEvaluacion"></span> / 10</dd>
                <dt>Observaciones</dt>
                <dd data-campo="observacionesEvaluacion"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="evaluacion-form.html">Editar</a>
                <a class="boton boton--secundario" href="evaluaciones.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/evaluacion.js"></script>
</body>
</html>
