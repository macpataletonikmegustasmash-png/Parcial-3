<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./src/img/logo.svg" />
    <title>Detalle del usuario | ReparaTec</title>
    <link rel="stylesheet" href="./src/css/usuario.css" />
</head>
<body>
    <include src="header.html"></include>

    <main class="contenedor">
        <p class="mensaje" id="mensaje">Cargando usuario...</p>

        <section class="tarjeta" id="detalle" hidden>
            <h1 data-campo="nombre_usuario"></h1>

            <dl class="datos">
                <dt>Correo</dt>
                <dd data-campo="correo"></dd>
                <dt>Teléfono</dt>
                <dd data-campo="telefono"></dd>
                <dt>Rol</dt>
                <dd data-campo="rol"></dd>
                <dt>Fecha de registro</dt>
                <dd data-campo="fecha_registro"></dd>
                <dt>Estado</dt>
                <dd data-campo="estado"></dd>
            </dl>

            <div class="formulario__acciones">
                <a class="boton" id="enlace-editar" href="usuario-form.html">Editar</a>
                <a class="boton boton--secundario" href="usuarios.html">Volver a la lista</a>
            </div>
        </section>
    </main>

    <include src="footer.html"></include>
    <script type="module" src="./src/js/usuario.js"></script>
</body>
</html>
